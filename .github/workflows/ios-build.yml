# Compilación automática en la nube (macOS-15 + Flutter 3.38 + Xcode) para SmartDisplay AI iOS.
# Compila la app real Flutter Material 3 (`flutter_ios/`) y genera SmartDisplayIOS-unsigned.ipa.
name: Build SmartDisplay iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Obtener dependencias Flutter
        working-directory: flutter_ios
        run: flutter pub get

      - name: Compilar SmartDisplay AI Flutter (iOS Release sin firma)
        working-directory: flutter_ios
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA sin firma (Sideloadly / AltStore / SideStore)
        working-directory: flutter_ios
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q SmartDisplayIOS-unsigned.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartDisplayIOS-unsigned-ipa
          path: flutter_ios/SmartDisplayIOS-unsigned.ipa
